<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
       body {
  background-color: white;
  margin: 0;
  padding: 0;
}

  #Introduccion {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  animation: SaltarIntroduccion 0.1s;
  animation-play-state: paused;
  animation-fill-mode: both;
  margin: 0;
  padding: 0;
}      
      
  #saltar {
  position: relative;
  background-color: white;
  text-align: center;
  border-radius: 5px;
  top: 500px;
  box-shadow: 0px 0px 2.5px;
  justify-self: end;
  font-size: 50px;
  animation: SaltarBoton 0.2s;
  animation-play-state: paused;
  animation-fill-mode: both;
}
  
  #Letrero {
  animation-play-state: paused;
  position: relative;
  animation: AnimacionLetrero 0.5s;
  animation-play-state: paused;
  animation-fill-mode: both;
  text-align: center;
  }
  
  #Libro1 {
  animation-play-state: paused;
  position: relative;
  animation: Libro 0.7s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
       
  #Boton1 {
  animation-play-state: paused;
  position: relative;
  animation: Boton 0.7s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
  
  #Boton2 {
  position: relative;
  animation-fill-mode: both;
  width: 0;
  height; 0;
  }
  
  #Boton3 {
  position: relative;
  animation-fill-mode: both;
  width: 0;
  height; 0;
  }
  
  #Empezar {
  animation-play-state: paused;
  position: relative;
  animation: Empezar 0.9s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
  
  #Texto {
  animation-play-state: paused;
  position: relative;
  animation: Texto 1.1s;
  animation-play-state: paused;
  animation-fill-mode: both;
    text-align: center;
  }

   #TerminosYCondiciones {
  position: relative;
  animation: CositasMas 1.2s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
  
   #PoliticaDePrivacidad {
  position: relative;
  animation: CositasMas 1.3s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
  
  .Libro {
      margin: 0 auto;
     display: flex;
     flex-direction: column;
}

  .Empezar {
      margin: 0 auto;
     display: flex;
     flex-direction: column;
}

.CositasMas {
text-align: center;
}

.Botones {
margin: 0 auto;
display: flex;
flex-direction: column;
     }

   @keyframes SaltarIntroduccion {
  0% {opacity: 1; width: 100%; height: 100%;}
  95% {opacity: 1; width: 100%; height: 100%;}
  100% {opacity: 0; width: 0; height: 0;}
  }
  
@keyframes AnimacionLetrero {
  0% {opacity: 0; font-size: 0px;}
  100% {opacity: 1; font-size: 25px;}
}

@keyframes Libro {
  0% {opacity: 0; width: 0%; max-height: 0%;}
  100% {opacity: 1; width: 15%; max-height: 100%;}
}

  @keyframes Boton {
  0% {opacity: 0; width: 0%; max-height: 0%; 25px; transform: translateY(0%);}
  100% {opacity: 1; width: 10%; max-height: 40%; transform: translateY(100%);}
}

  @keyframes Empezar {
  0% {opacity: 0; width: 0%; max-height: 0%;}
  100% {opacity: 1; width: 25%; max-height: 100%;}
}

@keyframes Texto {
  0% {opacity: 0; font-size: 0%;}
  100% {opacity: 1; font-size: 200%;}
}

@keyframes CositasMas {
  0% {opacity: 0; font-size: 0px;}
  100% {opacity: 1; font-size: 25px;}
}

 @keyframes SaltarBoton {
  0% {opacity: 1; width: 150px; height: 70px; padding: 5px; position: absolute; top: 0; right: 0; font-size: 50px;}
  100% {opacity: 0; width: 0px; height: 0px; padding: 0px;  position: absolute; top: 0; right: 0; font-size: 0px;}
}






@keyframes AnimacionLetreroSalto {
  0% {opacity: 0; font-size: 0px;}
  100% {opacity: 0; font-size: 0px;}
}



</style>
</head>
<body>

<video autoplay muted playsinline webkit-playsinline id="Introduccion">
  <source src="Prueba de introduccion vertical0001-0481.mp4" type="video/mp4">
</video>


<p class="Boton" id="saltar" onclick="saltarIntroduccion()"> Saltar </p>
<p id="Letrero"> Este es el único libro que recuperó Print. </p>

<img class="Libro" id="Libro1" src="https://github.com/JoseAngelVegas/borrador/blob/main/Sin%20nombre%20ni%20nada.png?raw=true">

<img class="Empezar" id="Empezar" src="https://github.com/JoseAngelVegas/borrador/blob/main/Iniciar.png?raw=true">

<p class="Texto" id="Texto"> Algo pasa por la mente de Print. Click en él para entrar a su mente. </p>

<p class="CositasMas" id="TerminosYCondiciones"> Términos y Condiciones. </p>
<p class="CositasMas" id="PoliticaDePrivacidad"> Política de privacidad. </p>



<img class="Botones" id="Boton1" onclick="salto1()" src="https://github.com/JoseAngelVegas/borrador/blob/main/Boton.png?raw=true">

<img class="Botones" id="Boton2" onclick="salto2()" src="https://github.com/JoseAngelVegas/borrador/blob/main/Boton.png?raw=true">

<img class="Botones" id="Boton3" onclick="salto3()" src="https://github.com/JoseAngelVegas/borrador/blob/main/Boton.png?raw=true">


<script>
function saltarIntroduccion() {
    document.getElementById("Introduccion").style.animationPlayState = "running";
    document.getElementById("saltar").style.animationPlayState = "running";
    document.getElementById("Letrero").style.animationPlayState = "running";
    document.getElementById("Libro1").style.animationPlayState = "running";
    document.getElementById("Boton1").style.animationPlayState = "running";
}
       
 function salto1() {
 
    document.getElementById("Letrero").style.animation = "AnimacionLetreroSalto 1s";
        document.getElementById("Letrero").style.animationFillMode = "both";


    document.getElementById("Libro1").style.width = "0";
    document.getElementById("Libro1").style.height = "0";
    
    document.getElementById("Empezar").style.animationPlayState = "running";
    
     document.getElementById("Boton1").style.width = "0";
    document.getElementById("Boton1").style.height = "0";
    
     document.getElementById("Boton2").style.width = "10%";
    document.getElementById("Boton2").style.maxHeight = "40%";
 }

 function salto2() {
 
  document.getElementById("Empezar").style.width = "0";
    document.getElementById("Empezar").style.height = "0";
 
    document.getElementById("TerminosYCondiciones").style.animationPlayState = "running";
    document.getElementById("PoliticaDePrivacidad").style.animationPlayState = "running";

 }

</script>

</body>
</html>
