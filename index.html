<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>


       body {
  background-color: white;
  margin: 0;
  padding: 0;
}

.Pizarra {
       position: relative;
       width: 100%;
       height: 100%;
       background: white;
}

.Nodos {
       position: absolute;
       width: 50%;
       max-height: 50%;
       display: flex;
       justify-content: center;
       align-items: center;
       cursor: pointer;
       user-select: none;
       display: none;
}

  #Introduccion {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  animation: SaltarIntroduccion 0.1s;
  animation-play-state: paused;
  animation-fill-mode: both;
  margin: 0;
  padding: 0;
}      
      
  #saltar {
  position: relative;
  background-color: white;
  text-align: center;
  border-radius: 5px;
  top: 500px;
  box-shadow: 0px 0px 2.5px;
  justify-self: end;
  font-size: 50px;
  animation: SaltarBoton 0.2s;
  animation-play-state: paused;
  animation-fill-mode: both;
}
  
  #Letrero {
  animation-play-state: paused;
  position: relative;
  animation: AnimacionLetrero 0.5s;
  animation-play-state: paused;
  animation-fill-mode: both;
  text-align: center;
  }
  
  #Libro1 {
  animation-play-state: paused;
  position: relative;
  animation: Libro 0.7s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
       
  #Boton1 {
  width: 0%;
  max-height: 0%;
  }

  
  #Empezar {
  animation-play-state: paused;
  position: relative;
  animation: Empezar 0.9s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
  
  #Texto {
  animation-play-state: paused;
  position: relative;
  animation: Texto 1.1s;
  animation-play-state: paused;
  animation-fill-mode: both;
    text-align: center;
  }

   #TerminosYCondiciones {
  position: relative;
  animation: CositasMas 1.2s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
  
   #PoliticaDePrivacidad {
  position: relative;
  animation: CositasMas 1.3s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
  
  .Libro {
      margin: 0 auto;
     display: flex;
     flex-direction: column;
}

  .Empezar {
      margin: 0 auto;
     display: flex;
     flex-direction: column;
}

.CositasMas {
text-align: center;
}

       .ElegirEpisodio {
text-align: center;
              font-size: 0%;
}

.Botones {
margin: 0 auto;
display: flex;
flex-direction: column;
     }

   @keyframes SaltarIntroduccion {
  0% {opacity: 1; width: 100%; height: 100%;}
  95% {opacity: 1; width: 100%; height: 100%;}
  100% {opacity: 0; width: 0; height: 0;}
  }
  
@keyframes AnimacionLetrero {
  0% {opacity: 0; font-size: 0px;}
  100% {opacity: 1; font-size: 250%;}
}

@keyframes Libro {
  0% {opacity: 0; width: 0%; max-height: 0%;}
  100% {opacity: 1; width: 40%; max-height: 100%;}
}

  @keyframes Boton {
  0% {opacity: 0; width: 0%; max-height: 0%; transform: translateY(0%);}
  100% {opacity: 1; width: 30%; max-height: 40%; transform: translateY(15%);}
}

  @keyframes Empezar {
  0% {opacity: 0; width: 0%; max-height: 0%;}
  100% {opacity: 1; width: 40%; max-height: 100%;}
}

@keyframes Texto {
  0% {opacity: 0; font-size: 0%;}
  100% {opacity: 1; font-size: 210%;}
}

@keyframes CositasMas {
  0% {opacity: 0; font-size: 0px;}
  100% {opacity: 1; font-size: 25px;}
}

 @keyframes SaltarBoton {
  0% {opacity: 1; width: 150px; height: 70px; padding: 5px; position: absolute; buttom: 0; right: 0; font-size: 50px;}
  100% {opacity: 0; width: 0px; height: 0px; padding: 0px;  position: absolute; buttom: 0; right: 0; font-size: 0px;}
}






@keyframes AnimacionLetreroSalto {
  0% {opacity: 0; font-size: 0px;}
  100% {opacity: 0; font-size: 0px;}
}

@keyframes LibroSaltar {
  0% {opacity: 1; width: 40%; max-height: 100%;}
  100% {opacity: 0; width: 0%; max-height: 0%;}
}

@keyframes TextoSalto {
  0% {opacity: 1; font-size: 210%;}
  100% {opacity: 0; font-size: 0%;}
}

  @keyframes EmpezarSalto {
  0% {opacity: 0; width: 0%; max-height: 0%;}
  100% {opacity: 0; width: 0%; max-height: 0%;}
}

@keyframes BotonSaltar {
  0% {opacity: 0; width: 0%; max-height: 0%; transform: translateY(0%);}
  100% {opacity: 0; width: 0%; max-height: 0%; transform: translateY(0%);}
}

@keyframes CositasMasSalto {
  0% {opacity: 0; font-size: 0px;}
  100% {opacity: 0; font-size: 0px;}
  
}

#PruebaMensaje {
display: none;
margin: 0 auto;
       
}

#PruebaMensaje.mostrar {
display: block;
animation: Libro 0.7;
animation-fill-mode: both;


}

#nodo1 { top: 200px; left: 50px; }
#nodo2 { top: 300px; left: 100px; }
#nodo3 { top: 400px; left: 200px; }

svg {
       position: absolute;
       top: 0;
       left: 0;
       width: 100%;
       height: 100%;
       pointer-events: none;
}

line { 
stroke: yellow;
stroke-width: 3;
stroke-linecap: round;
}

       #msg {
              position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  animation-play-state: paused;
  animation-fill-mode: both;
  margin: 0;
  padding: 0;
              z-index: 100;
              pointer-events: none;
              display: none;
       }



</style>
</head>
<body>

<p class="ElegirEpisodio" id="Episodio2"> Episodio 2 </p>
<p class="ElegirEpisodio" id="Episodio3"> Episodio 2 </p>


<img class="Botones" id="Boton1" onclick="Cerrar()" src="https://github.com/JoseAngelVegas/borrador/blob/main/Boton.png?raw=true">


<div class="PizarraContenedor" id="Pizarra">
       

<img class="Nodos" id="nodo1" src="https://github.com/JoseAngelVegas/borrador/blob/main/Boton.png?raw=true">
<img class="Nodos" id="nodo2" src="https://github.com/JoseAngelVegas/borrador/blob/main/Boton.png?raw=true">

       <video autoplay muted playsinline webkit-playsinline id="msg">

</video>







<video muted playsinline webkit-playsinline id="Cerebro">

       <script>
              
const cinematica1 = document.getElementById('Cerebro');

const nodo1 = document.getElementById('nodo1');

 nodo1.classList.remove('Nodos');
       
 });

 document.getElementById("PoliticaDePrivacidad").style.animation = "CositasMasSalto";

<script>

       let inicio = null, pares = new Set();
       const temp = document.getElementById('temp');

       const centro = n => {
              const r = n.getBoundingClientRect();
              return { x: r.left + r.width/2, y: r.top + r.height/2};
       };

       document.querySelectorAll('.Nodos').forEach(Nodos => {
              Nodos.addEventListener('click', (e) => {
                     e.stopPropagation();
                     const c = centro(Nodos);

       if (!inicio) {
              inicio = Nodos;
              Nodos.classList.add('activo');
              temp.setAttribute('x1', c.x);
              temp.setAttribute('y1', c.y);
              temp.setAttribute('x2', c.x);
              temp.setAttribute('y2', c.y);

              temp.style.display = 'block';
       }
                     else if (inicio !== Nodos) {
                            const sc = centro(inicio);
                            const key = [inicio.id, Nodos.id].sort().join('-');

                            if (!pares.has(key)) {
                                   pares.add(key);
                            const l = document.createElementNS("http://www.w3.org/2000/svg", "line");

                     l.setAttribute('x1', sc.x);
                     l.setAttribute('y1', sc.y);
                     l.setAttribute('x2', c.x);
                     l.setAttribute('y2', c.y);

               l.setAttribute('stroke', '#27ae20');
                                   
       document.querySelector('svg').appendChild(l);

               if (pares.size ===3) document.getElementById('msg').style.display = 'block';
                            }
                            reset();
                     }
              });
       });

       window.addEventListener('mousemove', e => {
              if (inicio) { temp.setAttribute('x2', e.clientX);
                          temp.setAttribute('y2', e.clientY); }
       });

       window.addEventListener('click', reset);

       function reset() {
              if (inicio) inicio.classList.remove('activo');
              inicio = null;
              temp.style.display = 'none';
       }
       
</script>

       
</body>
