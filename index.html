<html>

<body>

<head>

<video autoplay muted id="Introduccion">
  <source src="(Horizontal) Prueba0001-0481.mp4" type="video/mp4">
</video>

<p class="Boton" id="saltar" onclick="saltarIntroduccion()"> Saltar </p>

<p id="Letrero"> Este es el único libro que recuperó Print. </p>



<img class="Libro" id="Libro1" src="https://github.com/JoseAngelVegas/borrador/blob/main/Sin%20nombre%20ni%20nada.png?raw=true">

<img class="Empezar" id="Empezar" src="https://github.com/JoseAngelVegas/borrador/blob/main/Iniciar.png?raw=true">

<p class="CositasMas" id="TerminosYCondiciones"> Términos y Condiciones. </p>

<p class="CositasMas" id="PoliticaDePrivacidad"> Política de privacidad. </p>

<script>

function saltarIntroduccion() {

document.getElementById("saltar").style.animationPlayState = "running";

document.getElementById("Letrero").style.animationPlayState = "running";

document.getElementById("Libro1").style.animationPlayState = "running";

document.getElementById("TerminosYCondiciones").style.animationPlayState = "running";

document.getElementById("PoliticaDePrivacidad").style.animationPlayState = "running";

document.getElementById("Introduccion").style.animationPlayState = "running";
  

document.getElementById("Empezar").style.animationPlayState = "running";



}


</script>

<style>

       body {
  
  background-color: white;
}

  #Introduccion {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  animation: SaltarIntroduccion 1s;
  animation-play-state: paused;
  animation-fill-mode: both;
}     
      
  #saltar {
  position: relative;
  background-color: yellow;
  text-align: center;
  top: 500px;
  justify-self: end;
  font-size: 50px;
  animation: SaltarBoton 0.2s;
  animation-play-state: paused;
  animation-fill-mode: both;
}
  
  #Letrero {
  animation-play-state: paused;
  position: relative;
  animation: AnimacionLetrero 0.5s;
  animation-play-state: paused;
  animation-fill-mode: both;
  text-align: center;
  }
 

  
  #Libro1 {
  animation-play-state: paused;
  position: relative;
  animation: Libro 0.7s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }

  #Empezar {
  animation-play-state: paused;
  position: relative;
  animation: Empezar 0.7s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }

  
   #TerminosYCondiciones {
  position: relative;
  animation: CositasMas 0.8s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
  
  
   #PoliticaDePrivacidad {
  position: relative;
  animation: CositasMas 0.8s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
  
  
  .Libro {
      margin: 0 auto;
     display: flex;
     flex-direction: column;
}

  .Empezar {
      margin: 0 auto;
     display: flex;
     flex-direction: column;
}

.CositasMas {
text-align: center;

}

.CositasMas2 {
text-align: center;
}

   @keyframes SaltarIntroduccion {
  0% {opacity: 100%; width: 100%; height: 100%;}
  95% {opacity: 100%; width: 100%; height: 100%;}
  100% {opacity: 0%; width: 0%; height: 0%;}
  
  }
  
@keyframes AnimacionLetrero {
  0% {opacity: 0%; font-size: 0px;}
  100% {opacity: 100%; font-size: 50px;}
}

@keyframes Libro {
  0% {opacity: 0%; width: 0%; max-height: 0%;}
  100% {opacity: 100%;  width: 25%; max-height: 100%;}
}

  @keyframes Empezar {
  0% {opacity: 0%; width: 0%; max-height: 0%; translateY(0%);}
  100% {opacity: 100%;  width: 25%; max-height: 100%; translateY(2000%);}
}

@keyframes CositasMas {
  0% {opacity: 0%; font-size: 0px; transform: translateY(0%);}
  100% {opacity: 100%; font-size: 25px; transform: translateY(5700%);}
}


 @keyframes SaltarBoton {
  0% {opacity: 100%; width: 120px; height: 70px; padding: 5px;   justify-self: end; font-size: 50px;}
  100% {opacity: 0%; width: 0px; height: 0px; padding: 0px; justify-self: end; font-size: 0px;}
 
}


  
    
</style>

</head>

</body>

</html>
