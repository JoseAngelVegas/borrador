<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

       
<style>


       body {
  background-color: white;
  margin: 0;
  padding: 0;
}

.Pizarra {
       position: relative;
       width: 100%;
       height: 100%;
       background: white;
}

.Nodos {
       position: absolute;
       width: 25px;
       max-height: 40px;
       display: flex;
       justify-content: center;
       align-items: center;
       cursor: pointer;
       user-select: none;
       display: none;
       z-index: 100;
}

  #Introduccion {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  animation: SaltarIntroduccion 0.1s;
  animation-play-state: paused;
  animation-fill-mode: both;
  margin: 0;
  padding: 0;
}      
      
  #saltar {
  position: relative;
  background-color: white;
  text-align: center;
  border-radius: 5px;
  top: 500px;
  box-shadow: 0px 0px 2.5px;
  justify-self: end;
  font-size: 50px;
  animation: SaltarBoton 0.2s;
  animation-play-state: paused;
  animation-fill-mode: both;
}
  
  #Letrero {
  animation-play-state: paused;
  position: relative;
  animation: AnimacionLetrero 0.5s;
  animation-play-state: paused;
  animation-fill-mode: both;
  text-align: center;
  }
  
  #Libro1 {
  animation-play-state: paused;
  position: relative;
  animation: Libro 0.7s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
       
  #Boton1 {
  width: 0%;
  max-height: 0%;
  }

  
  #Empezar {
  animation-play-state: paused;
  position: relative;
  animation: Empezar 0.9s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
  
  #Texto {
  animation-play-state: paused;
  position: relative;
  animation: Texto 1.1s;
  animation-play-state: paused;
  animation-fill-mode: both;
    text-align: center;
  }

   #TerminosYCondiciones {
  position: relative;
  animation: CositasMas 1.2s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
  
   #PoliticaDePrivacidad {
  position: relative;
  animation: CositasMas 1.3s;
  animation-play-state: paused;
  animation-fill-mode: both;
  }
  
  .Libro {
      margin: 0 auto;
     display: flex;
     flex-direction: column;
}

  .Empezar {
      margin: 0 auto;
     display: flex;
     flex-direction: column;
}

.CositasMas {
text-align: center;
}

       .ElegirEpisodio {
text-align: center;
              font-size: 0%;
}

.Botones {
margin: 0 auto;
display: flex;
flex-direction: column;
     }

   @keyframes SaltarIntroduccion {
  0% {opacity: 1; width: 100%; height: 100%;}
  95% {opacity: 1; width: 100%; height: 100%;}
  100% {opacity: 0; width: 0; height: 0;}
  }
  
@keyframes AnimacionLetrero {
  0% {opacity: 0; font-size: 0px;}
  100% {opacity: 1; font-size: 250%;}
}

@keyframes Libro {
  0% {opacity: 0; width: 0%; max-height: 0%;}
  100% {opacity: 1; width: 40%; max-height: 100%;}
}

  @keyframes Boton {
  0% {opacity: 0; width: 0%; max-height: 0%; transform: translateY(0%);}
  100% {opacity: 1; width: 30%; max-height: 40%; transform: translateY(15%);}
}

  @keyframes Empezar {
  0% {opacity: 0; width: 0%; max-height: 0%;}
  100% {opacity: 1; width: 40%; max-height: 100%;}
}

@keyframes Texto {
  0% {opacity: 0; font-size: 0%;}
  100% {opacity: 1; font-size: 210%;}
}

@keyframes CositasMas {
  0% {opacity: 0; font-size: 0px;}
  100% {opacity: 1; font-size: 25px;}
}

 @keyframes SaltarBoton {
  0% {opacity: 1; width: 150px; height: 70px; padding: 5px; position: absolute; buttom: 0; right: 0; font-size: 50px;}
  100% {opacity: 0; width: 0px; height: 0px; padding: 0px;  position: absolute; buttom: 0; right: 0; font-size: 0px;}
}






@keyframes AnimacionLetreroSalto {
  0% {opacity: 0; font-size: 0px;}
  100% {opacity: 0; font-size: 0px;}
}

@keyframes LibroSaltar {
  0% {opacity: 1; width: 40%; max-height: 100%;}
  100% {opacity: 0; width: 0%; max-height: 0%;}
}

@keyframes TextoSalto {
  0% {opacity: 1; font-size: 210%;}
  100% {opacity: 0; font-size: 0%;}
}

  @keyframes EmpezarSalto {
  0% {opacity: 0; width: 0%; max-height: 0%;}
  100% {opacity: 0; width: 0%; max-height: 0%;}
}

@keyframes BotonSaltar {
  0% {opacity: 0; width: 0%; max-height: 0%; transform: translateY(0%);}
  100% {opacity: 0; width: 0%; max-height: 0%; transform: translateY(0%);}
}

@keyframes CositasMasSalto {
  0% {opacity: 0; font-size: 0px;}
  100% {opacity: 0; font-size: 0px;}
  
}




</style>
</head>
<body>

<p id="Letrero"> Este es el único libro que recuperó Print. </p>

<img class="Libro" id="Libro1" src="https://github.com/JoseAngelVegas/borrador/blob/main/Sin%20nombre%20ni%20nada.png?raw=true">

<video autoplay muted playsinline webkit-playsinline id="Introduccion">
  <source src="Prueba de introduccion vertical0001-0481.mp4" type="video/mp4">
</video>


    

<p class="Texto" id="Texto"> Algo pasa por la mente de Print. Click en él para entrar a su mente. </p>

<video autoplay muted loop playsinline webkit-playsinline id="Empezar" class="Empezar" onclick="mentePrint()">
  <source src="Empezar.mp4" type="video/mp4">
</video>


<p class="Boton" id="saltar" onclick="saltarIntroduccion()"> Saltar </p>

<p class="CositasMas" id="TerminosYCondiciones"> Términos y Condiciones. </p>
<p class="CositasMas" id="PoliticaDePrivacidad"> Política de privacidad. </p>   




<img id="P1" class="MenteDePrintPaginas" src="https://github.com/JoseAngelVegas/borrador/blob/main/1.png?raw=true">
<img id="P2" class="MenteDePrintPaginas"  src="https://github.com/JoseAngelVegas/borrador/blob/main/1.png?raw=true">




       
  

       
<script>
function saltarIntroduccion() {
    document.getElementById("Introduccion").style.animationPlayState = "running";
    document.getElementById("saltar").style.animationPlayState = "running";
    document.getElementById("Letrero").style.animationPlayState = "running";
    document.getElementById("Libro1").style.animationPlayState = "running";
document.getElementById("Empezar").style.animationPlayState = "running";
        document.getElementById("Texto").style.animationPlayState = "running";
          document.getElementById("TerminosYCondiciones").style.animationPlayState = "running";
    document.getElementById("PoliticaDePrivacidad").style.animationPlayState = "running";
       
}

       function mentePrint() {

 document.getElementById("PoliticaDePrivacidad").style.animation = "CositasMasSalto";
document.getElementById("PoliticaDePrivacidad").style.animationFillMode = "both";

 document.getElementById("TerminosYCondiciones").style.animation = "CositasMasSalto";
document.getElementById("TerminosYCondiciones").style.animationFillMode = "both";

       document.getElementById("Letrero").style.animation = "AnimacionLetreroSalto";
       
document.getElementById("Letrero").style.animationFillMode = "both";

       document.getElementById("Libro1").style.animation = "LibroSaltar";
document.getElementById("Libro1").style.animationFillMode = "both";

  document.getElementById("Texto").style.animation = "TextoSalto";
document.getElementById("Texto").style.animationFillMode = "both";
 
  document.getElementById("Empezar").style.animation = "EmpezarSalto";
      document.getElementById("Empezar").style.animationFillMode = "both";
      
     
   
document.getElementById("P1").style.width = "40%";
document.getElementById("P1").style.height = "40%";

pagina1.style.display = 'flex';
pagina2.style.display = 'flex';

document.getElementById("P2").style.width = "40%";
document.getElementById("P2").style.height = "40%";


              
       }
       
 function Cerrar() {
       
       document.getElementById("Letrero").style.animation = "AnimacionLetrero";
       document.getElementById("Letrero").style.animationPlayState = "running";
        document.getElementById("Letrero").style.animationFillMode = "both";
        
          document.getElementById("Libro1").style.animation = "Libro";
       document.getElementById("Libro1").style.animationPlayState = "running";
       
               document.getElementById("Libro1").style.animationFillMode = "both";

        
        document.getElementById("Boton1").style.width = "0%";
                document.getElementById("Boton1").style.maxHeight = "0%";


        
                
        document.getElementById("Letrero").style.animation = "AnimacionLetrero";
       document.getElementById("Letrero").style.animationPlayState = "running";
        document.getElementById("Letrero").style.animationFillMode = "both";
        
        document.getElementById("Empezar").style.animation = "Empezar";
       document.getElementById("Empezar").style.animationPlayState = "running";
        document.getElementById("Empezar").style.animationFillMode = "both";
        
        document.getElementById("Texto").style.animation = "Texto";
       document.getElementById("Texto").style.animationPlayState = "running";
        document.getElementById("Texto").style.animationFillMode = "both";
        
        document.getElementById("TerminosYCondiciones").style.animation = "CositasMas";
       document.getElementById("TerminosYCondiciones").style.animationPlayState = "running";
        document.getElementById("TerminosYCondiciones").style.animationFillMode = "both";
        
         document.getElementById("PoliticaDePrivacidad").style.animation = "CositasMas";
       document.getElementById("PoliticaDePrivacidad").style.animationPlayState = "running";
        document.getElementById("PoliticaDePrivacidad").style.animationFillMode = "both";
        
        document.getElementById("Episodio1").style.fontSize = "0%";
document.getElementById("Episodio2").style.fontSize = "0%";
 document.getElementById("Episodio3").style.fontSize = "0%";
document.getElementById("ElegirEpisodio").style.fontSize = "0%";
       
    
    }
      
</script>
























       








<style>
      

#P1 {
  display: flex;
  width: 0%;
  height: 0%;
  margin: 0 auto;
  padding: 0;
}

#P2 {
  display: flex;
  width: 0%;
  height: 0%;
  margin: 0 auto;
  padding: 0;
}

 @media only screen and (max-width:500px) {
       #P1, #P2 {
        width: 100% !important;
        height: auto !important;
        max-height: 100vh;
        object-fit: contain;
        }
 }
       
       
</style>

       <script>
              
const cinematica1 = document.getElementById('Cerebro');
const cinematica2 = document.getElementById('Cerebro2');
const nodo1 = document.getElementById('nodo1');
const nodo2 = document.getElementById('nodo2');
const nodo3 = document.getElementById('nodo3');
const boton = document.getElementById('Episodio1');

const pagina1 = document.getElementById('P1');
const pagina2 = document.getElementById('P2');


              boton.addEventListener('click', function() {

                     cinematica1.play();
              });

cinematica2.addEventListener('ended', function() {
       
nodo1.style.display = 'flex';
nodo2.style.display = 'flex';
nodo3.style.display = 'flex';

cinematica2.style.width = "0%";
cinematica2.style.height = "0%";
       
 });
       

cinematica1.addEventListener('click', function() {
cinematica1.pause();
cinematica1.style.width = "0%";
cinematica1.style.height = "0%";

cinematica2.style.width = "100%";
cinematica2.style.height = "100%";


       cinematica2.play();

});


</script>

       
</body>
</html>
