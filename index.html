<html>

<body>

<head>

<video autoplay muted id="Introduccion">
  <source src="(Horizontal) Introducción prueba.mp4" type="video/mp4">
</video>

<p class="Boton" id="saltar" onclick="saltarIntroduccion()"> Saltar </p>

<p id="Letrero"> Estos son los libros que recuerda. </p>

<p id="Letrero2"> Estos son los libros que recuerda. </p>

<script>

function saltarIntroduccion() {

document.getElementById("saltar").style.fontSize = "0px";
document.getElementById("saltar").style.padding = "0px";
document.getElementById("Introduccion").style.width = "0%";
document.getElementById("Introduccion").style.height = "0%";

document.getElementById("Letrero").style.animationPlayState = "running";

}


</script>

<style>

  body {
       background-color: white;
}

  #Introduccion {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  animation: SaltarSolo 15s;
  animation-play-state: running;
  animation-fill-mode: both;
}     
      
  #Saltar {
  position: relative;
  background-color: yellow;
  padding: 5px;
  text-align: center;
  justify-self: end;
  top: 500px;
  width: 200px;
  font-size: 50px;
  animation: SaltarSoloBoton 15s;
  animation-play-state: running;
  animation-fill-mode: both;
}

  #Letrero {
  animation-play-state: paused;
  position: relative;
  animation: AnimacionLetrero 0.5s;
  animation-play-state: paused;
  animation-fill-mode: both;
  text-align: center;
  }

   #Letrero2 {
  animation-play-state: paused;
  position: relative;
  animation: AnimacionLetrero2 15.5s;
  animation-play-state: paused;
  animation-fill-mode: both;
  text-align: center;
  }
  
@keyframes AnimacionLetrero {
  0% {opacity: 0%; font-Size: 0px;}
  100% {opacity: 100%; font-Size: 30px;}
}
  
  @keyframes SaltarSolo {
  0% {opacity: 100%; width: 100%; height: 100%;}
  95% {opacity: 100%; width: 100%; height: 100%;}
  100% {opacity: 0%; width: 0%; height: 0%;}
}

   @keyframes SaltarSoloBoton {
  0% {opacity: 100%; padding: 5px; fontSize: 50px;}
  95% {opacity: 100%; padding: 5px; fontSize: 50px;}
  100% {opacity: 0%; padding: 0px; fontSize: 0px;}
}

  @keyframes AnimacionLetrero2 {
   0% {opacity: 0%; font-Size: 0px;}
  95% {opacity: 0%; font-Size: 0px;}
  100% {opacity: 100%; font-Size: 30px;}
}

  
    
</style>

</head>

</body>

</html>
